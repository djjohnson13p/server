name: Retail Parity Validate Deterministic Fixes Fallback

on:
  push:
    branches:
      - 'retail-parity/codex-vanilla-zilart'
    paths:
      - '.github/workflows/retail-parity-validate-fallback.yml'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/runner_build.yml
    with:
      runner: ubuntu-latest
      compiler: gcc
      build_type: Debug
      tracy: false
      build_modules: false
      save_cache: false
      upload_artifact: false
      clang_tidy: false

  record-result:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out Codex work branch
        uses: actions/checkout@v4
        with:
          ref: retail-parity/codex-vanilla-zilart
          fetch-depth: 0
          persist-credentials: true

      - name: Record validation result
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          cat > retail_parity/vanilla_zilart/CODEX_VALIDATION_FALLBACK.md <<EOF
          # Codex Branch Automated Validation — Fallback

          Status: ${BUILD_RESULT}

          - Workflow: Retail Parity Validate Deterministic Fixes Fallback
          - Validated branch: \`retail-parity/codex-vanilla-zilart\`
          - Trigger commit: \`${VALIDATED_SHA}\`
          - Validation: LandSandBoat reusable \`ubuntu-latest\` GCC Debug build
          EOF

      - name: Commit result and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'retail-parity-automation'
          git config user.email 'retail-parity-automation@users.noreply.github.com'
          git rm .github/workflows/retail-parity-validate-fallback.yml
          git add retail_parity/vanilla_zilart/CODEX_VALIDATION_FALLBACK.md
          git pull --rebase origin retail-parity/codex-vanilla-zilart
          git push origin HEAD:retail-parity/codex-vanilla-zilart
