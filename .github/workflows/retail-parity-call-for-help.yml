name: Retail Parity Call for Help Scope

on:
  push:
    branches:
      - 'retail-parity/codex-vanilla-zilart'
    paths:
      - '.github/workflows/retail-parity-call-for-help.yml'

permissions:
  contents: write

jobs:
  apply-call-for-help:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Codex work branch
        uses: actions/checkout@v4
        with:
          ref: retail-parity/codex-vanilla-zilart
          fetch-depth: 0
          persist-credentials: true

      - name: Apply instance-wide personal-enmity Call for Help
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/map/packets/c2s/0x01a_action.cpp')
          text = path.read_text(encoding='utf-8-sig')
          start_marker = '        case GP_CLI_COMMAND_ACTION_ACTIONID::Help:\n        {'
          end_marker = '        break;\n        case GP_CLI_COMMAND_ACTION_ACTIONID::Weaponskill:'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Unable to locate the unique Call for Help action block')
          if text.find(start_marker, start + 1) >= 0:
              raise SystemExit('Multiple Call for Help action blocks found')

          replacement = '''        case GP_CLI_COMMAND_ACTION_ACTIONID::Help:
        {
            bool callForHelpSucceeded = false;

            PChar->loc.zone->ForEachMobInstance(
                PChar,
                [PChar, &callForHelpSucceeded](CMobEntity* PMob)
                {
                    if (!PMob->GetCallForHelpFlag() &&
                        PMob->PEnmityContainer->HasID(PChar->id) &&
                        !PMob->m_CallForHelpBlocked)
                    {
                        PMob->SetCallForHelpFlag(true);
                        callForHelpSucceeded = true;
                    }
                });

            if (callForHelpSucceeded)
            {
                PChar->loc.zone->PushPacket(PChar, CHAR_INRANGE_SELF, std::make_unique<GP_SERV_COMMAND_BATTLE_MESSAGE>(PChar, PChar, 0, 0, MsgBasic::CallForHelp));
                return;
            }

            PChar->pushPacket<GP_SERV_COMMAND_BATTLE_MESSAGE>(PChar, PChar, 0, 0, MsgBasic::CannotCallForHelp);
        }
'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Verify Call for Help source change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/map/packets/c2s/0x01a_action.cpp').read_text(encoding='utf-8')
          help_start = text.index('case GP_CLI_COMMAND_ACTION_ACTIONID::Help:')
          ws_start = text.index('case GP_CLI_COMMAND_ACTION_ACTIONID::Weaponskill:', help_start)
          block = text[help_start:ws_start]
          assert 'ForEachMobInstance' in block
          assert 'PEnmityContainer->HasID(PChar->id)' in block
          assert 'm_CallForHelpBlocked' in block
          assert 'GetBattleTarget' not in block
          assert block.count('MsgBasic::CallForHelp') == 1
          assert block.count('MsgBasic::CannotCallForHelp') == 1
          PY
          git diff --check

      - name: Commit fork-only correction and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'retail-parity-automation'
          git config user.email 'retail-parity-automation@users.noreply.github.com'
          git rm .github/workflows/retail-parity-call-for-help.yml
          git add src/map/packets/c2s/0x01a_action.cpp
          git commit -m 'fix: apply Call for Help to all personal-enmity mobs'
          git pull --rebase origin retail-parity/codex-vanilla-zilart
          git push origin HEAD:retail-parity/codex-vanilla-zilart
