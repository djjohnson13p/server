name: Retail Parity Shadowbind Resistance Guards

on:
  push:
    branches:
      - 'retail-parity/codex-vanilla-zilart'
    paths:
      - '.github/workflows/retail-parity-shadowbind.yml'

permissions:
  contents: write

jobs:
  apply-shadowbind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Codex work branch
        uses: actions/checkout@v4
        with:
          ref: retail-parity/codex-vanilla-zilart
          fetch-depth: 0
          persist-credentials: true

      - name: Add shared status-effect guards to Shadowbind
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/globals/job_utils/ranger.lua')
          text = path.read_text(encoding='utf-8')
          old = '''    -- TODO: Acc penalty for /RNG, acc vs. mob level?
    if
        math.randomInt(0, 99) >= target:getMod(xi.mod.BIND_MEVA) and
        not target:hasStatusEffect(xi.effect.BIND)
    then
'''
          new = '''    local bindSucceeded =
        not target:hasStatusEffect(xi.effect.BIND) and
        not xi.data.statusEffect.isTargetImmune(target, xi.effect.BIND, xi.element.ICE) and
        not xi.data.statusEffect.isTargetResistant(player, target, xi.effect.BIND) and
        not xi.data.statusEffect.isEffectNullified(target, xi.effect.BIND, 0) and
        math.randomInt(0, 99) >= target:getMod(xi.mod.BIND_MEVA)

    -- TODO: Acc penalty for /RNG, acc vs. mob level?
    if bindSucceeded then
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one Shadowbind baseline block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify Shadowbind source change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('scripts/globals/job_utils/ranger.lua').read_text(encoding='utf-8')
          start = text.index('xi.job_utils.ranger.useShadowbind')
          end = text.index('xi.job_utils.ranger.useUnlimitedShot', start)
          block = text[start:end]
          assert 'isTargetImmune(target, xi.effect.BIND, xi.element.ICE)' in block
          assert 'isTargetResistant(player, target, xi.effect.BIND)' in block
          assert 'isEffectNullified(target, xi.effect.BIND, 0)' in block
          assert 'math.randomInt(0, 99) >= target:getMod(xi.mod.BIND_MEVA)' in block
          assert 'if bindSucceeded then' in block
          assert 'shouldUseAmmo(player)' in block
          PY
          git diff --check

      - name: Commit fork-only correction and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'retail-parity-automation'
          git config user.email 'retail-parity-automation@users.noreply.github.com'
          git rm .github/workflows/retail-parity-shadowbind.yml
          git add scripts/globals/job_utils/ranger.lua
          git commit -m 'fix: honor status resistance guards for Shadowbind'
          git pull --rebase origin retail-parity/codex-vanilla-zilart
          git push origin HEAD:retail-parity/codex-vanilla-zilart
